services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osaf}
      POSTGRES_USER: ${POSTGRES_USER:-osaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osaf} -d ${POSTGRES_DB:-osaf}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-osaf}
      POSTGRES_USER: ${POSTGRES_USER:-osaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Ollama Cloud — used by the LLM near-dupe batch job (scripts/dedupe_llm.py)
      OLLAMA_URL: ${OLLAMA_URL:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-5.2:cloud}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  collector:
    build: ./collector
    restart: unless-stopped
    environment:
      COLLECTOR_OSAF_API_URL: http://backend:8000/api/v1
      COLLECTOR_OSAF_USERNAME: ${COLLECTOR_USERNAME:-collector}
      COLLECTOR_OSAF_PASSWORD: ${COLLECTOR_PASSWORD:?Set COLLECTOR_PASSWORD in .env}
      COLLECTOR_OLLAMA_URL: ${COLLECTOR_OLLAMA_URL:-https://api.ollama.com}
      COLLECTOR_OLLAMA_API_KEY: ${COLLECTOR_OLLAMA_API_KEY:-}
      COLLECTOR_OLLAMA_MODEL: ${COLLECTOR_OLLAMA_MODEL:-qwen3-coder:480b}
      COLLECTOR_REDDIT_CLIENT_ID: ${COLLECTOR_REDDIT_CLIENT_ID:-}
      COLLECTOR_REDDIT_CLIENT_SECRET: ${COLLECTOR_REDDIT_CLIENT_SECRET:-}
    depends_on:
      - backend
    volumes:
      - collector_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    ports:
      - "${OSAF_BIND_ADDRESS:-127.0.0.1}:${OSAF_BIND_PORT:-80}:8080"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  collector_data:
