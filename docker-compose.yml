services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osaf}
      POSTGRES_USER: ${POSTGRES_USER:-osaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osaf} -d ${POSTGRES_DB:-osaf}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-osaf}
      POSTGRES_USER: ${POSTGRES_USER:-osaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  collector:
    build: ./collector
    restart: unless-stopped
    environment:
      COLLECTOR_OSAF_API_URL: http://backend:8000/api/v1
      COLLECTOR_OSAF_USERNAME: ${COLLECTOR_USERNAME:-collector}
      COLLECTOR_OSAF_PASSWORD: ${COLLECTOR_PASSWORD:?Set COLLECTOR_PASSWORD in .env}
      COLLECTOR_OLLAMA_URL: ${COLLECTOR_OLLAMA_URL:-https://api.ollama.com}
      COLLECTOR_OLLAMA_API_KEY: ${COLLECTOR_OLLAMA_API_KEY:-}
      COLLECTOR_OLLAMA_MODEL: ${COLLECTOR_OLLAMA_MODEL:-qwen3-coder:480b}
      COLLECTOR_REDDIT_CLIENT_ID: ${COLLECTOR_REDDIT_CLIENT_ID:-}
      COLLECTOR_REDDIT_CLIENT_SECRET: ${COLLECTOR_REDDIT_CLIENT_SECRET:-}
    depends_on:
      - backend
    volumes:
      - collector_data:/app/data
      - ./collector:/app/collector

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  collector_data:
