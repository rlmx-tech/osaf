      name="twitter:description"

    />
    <meta name="twitter:image" content="https://osaf.net/og-image.png" />
    <meta name="twitter:image:alt" content="OSAF — Open Shark Attack File" />

    <!-- Structured data: Organization + Dataset (Google Dataset Search) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://osaf.net/#organization",
            "name": "OSAF — Open Shark Attack File",
            "url": "https://osaf.net/",
            "logo": "https://osaf.net/apple-touch-icon.png",
            "description": "An open-source, community-driven shark incident database and a transparent alternative to restricted academic shark attack files."
          },
          {
            "@type": "Dataset",
            "@id": "https://osaf.net/#dataset",
            "name": "Open Shark Attack File (OSAF)",
            "description": "A public, community-maintained dataset of documented shark-human incidents worldwide, using the ISAF classification methodology. Each record includes date, location with coordinates, classification, shark species, victim activity and outcome, and cited sources.",
            "url": "https://osaf.net/",
            "keywords": [
              "shark attacks",
              "shark bites",
              "shark incidents",
              "marine biology",
              "unprovoked shark attack",
              "open data"
            ],
            "isAccessibleForFree": true,
            "license": "https://creativecommons.org/licenses/by/4.0/",
            "creator": { "@id": "https://osaf.net/#organization" },
            "publisher": { "@id": "https://osaf.net/#organization" },
            "distribution": [
              {
                "@type": "DataDownload",
                "encodingFormat": "application/json",
                "contentUrl": "https://osaf.net/api/v1/incidents"
              }
            ]
          }
        ]
      }
    </script>
