upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# Bootstrap config — HTTP only, no HTTPS redirect.
# Used during initial deployment to allow certbot to complete the ACME
# HTTP-01 challenge before TLS certs exist.
#
# Deploy sequence:
#   1. Start stack with this config (./nginx/nginx.bootstrap.conf mounted)
#   2. Run: certbot certonly --webroot -w /var/www/certbot -d osaf.net -d www.osaf.net
#   3. Swap to nginx.prod.conf, restart nginx container
#
# See deploy/deploy.sh for the full automated sequence.

server {
    listen 80;
    server_name osaf.net www.osaf.net;

    # Certbot ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API routes
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # Frontend SPA — all non-API routes
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
